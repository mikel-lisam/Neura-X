# ==========================================================
# Neura-X: Intelligence Without Limits.
# Copyright (c) 2026 Edusei Mikel Lisamba. All Rights Reserved.
#
# Python Package Configuration
# Build system: maturin (Rust-Python bridge)
#
# ==========================================================

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

# ──────────────────────────────────────────────────────────
# PROJECT METADATA
# ──────────────────────────────────────────────────────────

[project]
name = "neura-x"
version = "1.0.0"
description = "Intelligence Without Limits. CPU-first universal AI framework."
readme = "README.md"
license = { text = "Neura-X Dual License (Community + Commercial)" }
requires-python = ">=3.9"
authors = [
    { name = "Edusei Mikel Lisamba", email = "founder@neura-x.dev" }
]
maintainers = [
    { name = "Edusei Mikel Lisamba", email = "founder@neura-x.dev" }
]
keywords = [
    "ai",
    "machine-learning",
    "deep-learning",
    "cpu",
    "llm",
    "training",
    "fine-tuning",
    "inference",
    "fractal-tensors",
    "neura-x",
    "intelligence-without-limits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Education",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # Core dependency - no version constraint to maximize compatibility
    # pip will install the latest compatible version or skip if already installed
    "numpy",
]

[project.optional-dependencies]
# Full ecosystem integration for data science workflows
full = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "tokenizers>=0.15.0",
]

# Audio processing for speech and music generation
audio = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "audioread>=3.0.0",
]

# Image and video processing for vision models
vision = [
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
]

# Experiment tracking and monitoring
tracking = [
    "wandb>=0.16.0",
    "mlflow>=2.9.0",
]

# Web serving for OpenAI-compatible API
serve = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
]

# Demo interfaces for quick prototyping
demo = [
    "gradio>=4.0.0",
    "streamlit>=1.29.0",
]

# Development and testing tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

# Documentation generation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

# Install everything
all = [
    "neura-x[full,audio,vision,tracking,serve,demo,dev,docs]",
]

[project.urls]
Homepage = "https://neura-x.dev"
Repository = "https://github.com/edusei-lisamba/neura-x"
Documentation = "https://docs.neura-x.dev"
Issues = "https://github.com/edusei-lisamba/neura-x/issues"
Changelog = "https://github.com/edusei-lisamba/neura-x/blob/main/CHANGELOG.md"
Whitepaper = "https://neura-x.dev/whitepaper"

# ──────────────────────────────────────────────────────────
# ENTRY POINTS (CLI)
# ──────────────────────────────────────────────────────────

[project.scripts]
neura-x = "neura_x.cli:main"
nx = "neura_x.cli:main"

# ──────────────────────────────────────────────────────────
# MATURIN CONFIGURATION (Rust-Python Bridge)
# ──────────────────────────────────────────────────────────

[tool.maturin]
# The Rust crate that provides the Python bindings
manifest-path = "core/rust/python_bridge/Cargo.toml"
# Module name in Python
module-name = "neura_x._core"
# Include all Cargo crates in the build
workspace = false
# Build in release mode by default
profile = "release"
# Include the C/C++ shared libraries
include = [
    { path = "build/libneura_c.so", format = "wheel" },
    { path = "build/libneura_cpp.so", format = "wheel" },
]
# Bindings type
bindings = "pyo3"
# Python source layout
python-source = "python"

# ──────────────────────────────────────────────────────────
# TOOL CONFIGURATIONS
# ──────────────────────────────────────────────────────────

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]
exclude = [
    "build",
    "dist",
    ".git",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "gpu: marks tests that require GPU",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["python/neura_x"]
omit = [
    "python/tests/*",
    "python/setup.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80