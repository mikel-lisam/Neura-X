[package]
name = "neura-x-python-bridge"
version = "1.0.0"
edition = "2021"
authors = ["Edusei Mikel Lisamba <lisambamikel@gmail.com>"]
description = "Neura-X Python Bridge — PyO3 bindings"
license = "Proprietary"
repository = "https://github.com/mikeledusei/Neura-X"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neura-x-pager = { path = "../pager" }
neura-x-nex-format = { path = "../nex_format" }
neura-x-serve = { path = "../serve" }

[lib]
name = "_core"  # Changed from "neura_x_core" to "_core"
crate-type = ["cdylib"]