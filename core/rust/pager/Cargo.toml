[package]
name = "neura-x-pager"
version = "1.0.0"
edition = "2021"
authors = ["Edusei Mikel Lisamba <lisambamikel@gmail.com>"]
description = "Neura-X Memory Pager — Intelligent RAM/disk page management"
license-file = "../../../LICENSE"
repository = "https://github.com/mikeledusei/Neura-X"

[dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[lib]
name = "neura_x_pager"
crate-type = ["lib"]