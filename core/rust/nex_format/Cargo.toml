[package]
name = "neura-x-nex-format"
version = "1.0.0"
edition = "2021"
authors = ["Edusei Mikel Lisamba <lisambamikel@gmail.com>"]
description = "Neura-X .nex File Format — Serializer, Deserializer, Founder's Lock"
license-file = "../../../LICENSE"
repository = "https://github.com/mikeledusei/Neura-X"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "3.0"
zstd = "0.13"
sha2 = "0.11"
hex = "0.4"
log = "0.4"

[lib]
name = "neura_x_nex_format"
crate-type = ["lib"]