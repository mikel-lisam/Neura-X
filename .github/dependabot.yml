version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/core/rust/pager"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "rust"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/core/rust/nex_format"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "rust"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/core/rust/serve"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "rust"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/core/rust/python_bridge"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "rust"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "python"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
