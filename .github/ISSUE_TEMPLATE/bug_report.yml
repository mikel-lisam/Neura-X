name: Bug Report
description: File a reproducible bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping Neura-X grow.
        **Intelligence Without Limits — founded by Edusei Mikel Lisamba.**
        Please provide enough detail for the bug to be reproduced on the
        Genesis Machine (Dell Latitude E7450, i7-5600U, 8 GB RAM).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that trigger the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Neura-X version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU and RAM
      placeholder: "i7-5600U, 8 GB"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I have run `make all` and the issue persists.
          required: true
        - label: I confirm this report follows the Community License terms.
          required: true