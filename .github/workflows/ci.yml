name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────
  # C and C++ native libraries
  # ────────────────────────────────────────────────────────
  native:
    name: C / C++ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build C library
        run: make c

      - name: Build C++ library
        run: make cpp

      - name: Verify artifacts
        run: |
          test -f build/libneura_c.so
          test -f build/libneura_cpp.so
          echo "✅ libneura_c.so and libneura_cpp.so built"

  # ────────────────────────────────────────────────────────
  # Rust crates
  # ────────────────────────────────────────────────────────
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/pager/target
            core/rust/nex_format/target
            core/rust/serve/target
            core/rust/python_bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build all crates
        run: |
          cd core/rust/pager        && cargo build --release
          cd ../nex_format          && cargo build --release
          cd ../serve               && cargo build --release
          cd ../python_bridge       && cargo build --release

      - name: Test crates
        run: |
          cd core/rust/pager        && cargo test --quiet
          cd ../nex_format          && cargo test --quiet
          cd ../serve               && cargo test --quiet

  # ────────────────────────────────────────────────────────
  # Python unit tests across versions
  # ────────────────────────────────────────────────────────
  python:
    name: Python Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [native, rust]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Run unit tests
        run: |
          cd python
          python -m pytest tests/ -v --tb=short

      - name: Run integration tests
        run: |
          if [ -f test_integration.py ]; then
            python test_integration.py
          else
            echo "test_integration.py not present — skipped"
          fi

  # ────────────────────────────────────────────────────────
  # End-to-end: full build + native core verification
  # ────────────────────────────────────────────────────────
  end-to-end:
    name: Native Core End-to-End
    runs-on: ubuntu-latest
    needs: [native, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Full build (C → C++ → Rust → wheel → install)
        run: make all

      - name: Verify native core
        run: |
          python -c "import neura_x as nx; assert nx._core_available, 'core missing'; print('Core OK:', nx._core.get_version())"

      - name: Run real-computation verification
        run: |
          if [ -f verify_real_tests.py ]; then
            python verify_real_tests.py
          else
            echo "verify_real_tests.py not present — skipped"
          fi